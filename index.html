<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World!</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
    background-size: 200% 200%;
    animation: drift 12s ease infinite;
    transition: background 0.4s;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    text-align: center;
    padding: 3rem 2.5rem;
    border-radius: 1.25rem;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: #fff;
    margin: 0 0 0.5rem;
    transition: transform 0.15s ease;
  }
  p {
    color: rgba(255,255,255,0.7);
    margin: 0 0 1.5rem;
  }
  button {
    font-size: 1rem;
    padding: 0.7rem 1.5rem;
    border: none;
    border-radius: 999px;
    background: #fff;
    color: #312e81;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Hello, World! 👋</h1>
    <p>the start of vibe coding on GitHub</p>
    <button onclick="wave()">say it again</button>
  </div>

<script>
  const greetings = [
    "Hello, World! 👋",
    "Hola, Mundo! 🌍",
    "Bonjour, Monde! 🥐",
    "Namaste, Duniya! 🙏",
    "こんにちは、世界！🎌",
    "Ciao, Mondo! 🍕",
    "Hallo, Welt! 🍺",
    "Olá, Mundo! ⚽"
  ];

  const heading = document.getElementById("greeting");

  function wave() {
    const next = greetings[Math.floor(Math.random() * greetings.length)];
    heading.style.transform = "scale(0.9) rotate(-3deg)";
    setTimeout(() => {
      heading.textContent = next;
      heading.style.transform = "scale(1.05) rotate(2deg)";
      setTimeout(() => { heading.style.transform = "scale(1) rotate(0deg)"; }, 150);
    }, 150);
  }
</script>
</body>
</html>
